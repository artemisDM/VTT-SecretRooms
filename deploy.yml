name: Publish VeilCast Secret Rooms

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_monsters:
        description: 'Add Monster Manager? Choose no to deploy the original Secret Rooms-only site.'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate new Monster Manager syntax
        run: node --check monster_manager_feature.js

      - name: Build the existing Secret Rooms VeilCast (unchanged)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '# GitHub Pages build placeholder' > start_veilcast.py
          python3 build_veilcast_secretrooms.py
          test -s VeilCast_SecretRooms/index.html
          grep -q 'BEGIN VeilCast Secret Room Toggle' VeilCast_SecretRooms/index.html
          echo 'Existing Secret Rooms functionality present.'

      - name: Verify and add Monster Manager (skip when doing rollback)
        shell: bash
        env:
          MONSTERS_INPUT: ${{ inputs.enable_monsters }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$MONSTERS_INPUT" == "no" ]]; then
            echo 'ROLLBACK MODE: Leaving working Secret Rooms-only website unchanged.'
          else
            python3 add_monster_manager.py --check-only
            python3 add_monster_manager.py
            grep -q 'BEGIN VeilCast Monster Manager' VeilCast_SecretRooms/index.html
            grep -q 'initSecretRooms();' VeilCast_SecretRooms/index.html
            grep -q 'initMonsterManager();' VeilCast_SecretRooms/index.html
            echo 'Both Secret Rooms and Monster Manager installed.'
          fi

      - name: Prepare static website
        shell: bash
        run: |
          set -euo pipefail
          rm -f VeilCast_SecretRooms/start_veilcast.py
          rm -f VeilCast_SecretRooms/START_WINDOWS.bat
          rm -f VeilCast_SecretRooms/START_MAC_LINUX.sh
          touch VeilCast_SecretRooms/.nojekyll
          test -s VeilCast_SecretRooms/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages website
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./VeilCast_SecretRooms

      - name: Confirm artifact upload
        shell: bash
        run: |
          echo 'Uploaded artifact ID: ${{ steps.upload.outputs.artifact_id }}'
          test -n '${{ steps.upload.outputs.artifact_id }}'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
