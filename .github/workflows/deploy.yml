name: Publish VeilCast Secret Rooms

on:
  # Deliberately manual-only: uploading the upgrade files will NOT republish
  # or touch the currently working Secret Rooms website.
  workflow_dispatch:
    inputs:
      enable_combat_tokens:
        description: 'Enable experimental combat-tracker map tokens? (No = rollback to Secret Rooms only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Secret Rooms (existing feature)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '# GitHub Pages build placeholder' > start_veilcast.py
          python3 build_veilcast_secretrooms.py
          test -s VeilCast_SecretRooms/index.html
          grep -q 'BEGIN VeilCast Secret Room Toggle' VeilCast_SecretRooms/index.html

      - name: Test combat-token patch without modifying the website
        if: ${{ inputs.enable_combat_tokens == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 test_upgrade.py
          python3 add_combat_tokens.py --check-only
          node --check combat_tokens_feature.js

      - name: Apply combat-token patch ONLY when explicitly enabled
        if: ${{ inputs.enable_combat_tokens == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 add_combat_tokens.py
          grep -q 'BEGIN VeilCast Combat Tracker Map Tokens' VeilCast_SecretRooms/index.html
          grep -q 'BEGIN VeilCast Secret Room Toggle' VeilCast_SecretRooms/index.html

      - name: Remove local-only launchers
        shell: bash
        run: |
          set -euo pipefail
          rm -f VeilCast_SecretRooms/start_veilcast.py
          rm -f VeilCast_SecretRooms/START_WINDOWS.bat
          rm -f VeilCast_SecretRooms/START_MAC_LINUX.sh
          touch VeilCast_SecretRooms/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./VeilCast_SecretRooms

      - name: Verify uploaded artifact
        run: |
          echo "Artifact ID: ${{ steps.upload.outputs.artifact_id }}"
          test -n '${{ steps.upload.outputs.artifact_id }}'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
