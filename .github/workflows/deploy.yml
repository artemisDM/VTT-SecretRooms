name: Publish VeilCast Secret Rooms

on:
  workflow_dispatch:
    inputs:
      enable_fog_exclusion:
        description: 'Include the Exclude from fog checkbox?'
        required: true
        type: boolean
        default: false
      enable_player_colors:
        description: 'Add a character-color picker to native New Player and Multi Add dialogs?'
        required: true
        type: boolean
        default: false
      enable_multi_add:
        description: 'Include the experimental Multi Add campaign players button?'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build unmodified VeilCast plus existing Secret Rooms
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '# GitHub Pages placeholder' > start_veilcast.py
          python3 build_veilcast_secretrooms.py
          test -s VeilCast_SecretRooms/index.html
          grep -q 'BEGIN VeilCast Secret Room Toggle' VeilCast_SecretRooms/index.html
          ! grep -q 'BEGIN VeilCast Combat Tracker Map Tokens' VeilCast_SecretRooms/index.html
          ! grep -q 'BEGIN VeilCast Monster Manager' VeilCast_SecretRooms/index.html
      - name: Add existing Fog Exclusion only when requested
        if: ${{ inputs.enable_fog_exclusion == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 add_fog_exclusion.py --check-only
          python3 add_fog_exclusion.py
          grep -q 'BEGIN VeilCast Per-Token Fog Exclusion Toggle' VeilCast_SecretRooms/index.html
      - name: Test Multi Add source patch and syntax
        if: ${{ inputs.enable_multi_add == true }}
        shell: bash
        run: |
          set -euo pipefail
          node --check multi_add_feature.js
          python3 test_multi_add.py
      - name: Add Multi Add only when requested
        if: ${{ inputs.enable_multi_add == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 add_multi_add.py --check-only
          python3 add_multi_add.py
          grep -q 'BEGIN VeilCast Native Campaign Player Multi Add' VeilCast_SecretRooms/index.html
          grep -q 'BEGIN VeilCast Secret Room Toggle' VeilCast_SecretRooms/index.html
          ! grep -q 'BEGIN VeilCast Combat Tracker Map Tokens' VeilCast_SecretRooms/index.html
          ! grep -q 'BEGIN VeilCast Monster Manager' VeilCast_SecretRooms/index.html
      - name: Add native player color picker (optional)
        if: ${{ inputs.enable_player_colors == true }}
        shell: bash
        run: |
          set -euo pipefail
          node --check player_color_feature.js
          python3 test_player_colors.py
          python3 add_player_colors.py --check-only
          python3 add_player_colors.py
          grep -q 'BEGIN VeilCast Campaign Player Color Picker' VeilCast_SecretRooms/index.html
      - name: Strip local launchers, preserve upstream LICENSE
        shell: bash
        run: |
          set -euo pipefail
          rm -f VeilCast_SecretRooms/start_veilcast.py
          rm -f VeilCast_SecretRooms/START_WINDOWS.bat
          rm -f VeilCast_SecretRooms/START_MAC_LINUX.sh
          test -s VeilCast_SecretRooms/LICENSE
          touch VeilCast_SecretRooms/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./VeilCast_SecretRooms
      - name: Check artifact upload
        shell: bash
        run: |
          echo 'Artifact ID: ${{ steps.upload.outputs.artifact_id }}'
          test -n '${{ steps.upload.outputs.artifact_id }}'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
